<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="creative-medium" content="interactive-prototype" />
<title>五分化训练动作库</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;600;700;900&family=Noto+Serif+SC:wght@600;700&display=swap" />
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #f6f3ec;
    --bg-elev: #ffffff;
    --bg-card: #ffffff;
    --ink: #1a2236;
    --ink-2: #3d4760;
    --ink-3: #6b7385;
    --line: #e4ded2;
    --line-2: #ece7db;
    --accent: #c76143;
    --accent-soft: #f1dfd6;
    --accent-deep: #9e462c;
    --ok: #2f6e50;
    --ok-soft: #ddeee4;
    --warn: #c46a2b;
    --warn-soft: #f5e2cb;
    --stop: #a83737;
    --stop-soft: #f6dcdc;
    --chip-bg: #efece3;
    --chip-ink: #5a6275;
    --shadow-sm: 0 1px 2px rgba(26,34,54,.06), 0 1px 1px rgba(26,34,54,.04);
    --shadow-md: 0 4px 16px rgba(26,34,54,.08), 0 2px 4px rgba(26,34,54,.04);
    --shadow-lg: 0 16px 48px rgba(26,34,54,.18), 0 4px 12px rgba(26,34,54,.08);
    --radius: 12px;
    --radius-lg: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .app { max-width: 1120px; margin: 0 auto; padding: 24px 20px 80px; }

  /* Hero */
  .hero { margin-bottom: 18px; }
  .hero-tag {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 500;
    color: var(--accent-deep); background: var(--accent-soft);
    padding: 4px 10px; border-radius: 999px; letter-spacing: .5px;
  }
  .hero-tag .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .hero h1 {
    font-family: "Noto Serif SC", serif;
    font-size: 28px; font-weight: 700;
    margin: 10px 0 6px; letter-spacing: .5px;
  }
  .hero-sub { color: var(--ink-3); font-size: 14px; line-height: 1.7; max-width: 760px; }
  .hero-sub strong { color: var(--ink-2); font-weight: 600; }

  /* Dosage selector bar */
  .dosage-bar {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 14px 18px;
    margin-bottom: 18px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: 6px;
    z-index: 15;
  }
  .ds-group label {
    display: block;
    font-size: 11px; font-weight: 600;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: .8px;
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .ds-group label::before {
    content: ""; width: 2px; height: 10px;
    background: var(--accent); border-radius: 1px;
  }
  .ds-options {
    display: flex; gap: 4px;
    background: var(--chip-bg);
    padding: 3px;
    border-radius: 10px;
  }
  .ds-option {
    flex: 1;
    border: none; background: transparent;
    padding: 8px 10px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 12px;
    color: var(--ink-3);
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
    text-align: center;
    line-height: 1.3;
  }
  .ds-option:hover { color: var(--ink); }
  .ds-option.active {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 1px 4px rgba(199,97,67,.4);
  }
  .ds-explain {
    grid-column: 1 / -1;
    font-size: 12px;
    color: var(--ink-3);
    border-top: 1px dashed var(--line);
    padding-top: 10px;
    margin-top: 2px;
    line-height: 1.6;
  }
  .ds-explain strong { color: var(--accent-deep); }

  /* Day tabs */
  .tabs {
    display: flex; gap: 4px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 6px;
    margin-bottom: 18px;
    box-shadow: var(--shadow-sm);
  }
  .tab-btn {
    flex: 1; border: none; background: transparent;
    padding: 10px 8px; border-radius: 10px; cursor: pointer;
    font-family: inherit; color: var(--ink-3);
    transition: all .2s;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .tab-btn:hover { background: var(--line-2); color: var(--ink); }
  .tab-btn.active {
    background: var(--ink); color: #fff;
    box-shadow: 0 2px 8px rgba(26,34,54,.25);
  }
  .tab-day { font-size: 14px; font-weight: 500; }
  .tab-theme { font-size: 11px; opacity: .7; font-weight: 400; }
  .tab-btn.active .tab-theme { opacity: .8; }

  /* Day header */
  .day-header {
    margin-bottom: 16px;
  }
  .day-title-row {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 14px; flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .day-title {
    font-family: "Noto Serif SC", serif;
    font-size: 22px; font-weight: 700; margin: 0;
  }
  .day-benefit {
    color: var(--ink-3); font-size: 13px;
    line-height: 1.65;
  }
  .day-benefit strong { color: var(--ink-2); }
  .day-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .meta-chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--ink-2);
    background: var(--chip-bg);
    padding: 4px 10px; border-radius: 999px;
  }

  /* Exercise list */
  .exercise-list { display: flex; flex-direction: column; gap: 8px; }
  .ex-card {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: grid;
    grid-template-columns: 40px 1fr auto;
    gap: 12px; align-items: center;
    cursor: pointer;
    transition: all .2s;
  }
  .ex-card:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }
  .ex-card.warmup, .ex-card.cardio {
    background: #f1efe6;
    border-style: dashed;
  }
  .ex-card.stretch-card {
    background: linear-gradient(135deg, #f4efe5 0%, #efe6d3 100%);
    border: 1px solid #dfd3b8;
  }
  .ex-card.warmup:hover, .ex-card.cardio:hover, .ex-card.stretch-card:hover {
    transform: none; box-shadow: none;
  }
  .ex-num {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 14px;
    background: var(--bg-elev); border: 1px solid var(--line);
    color: var(--ink-2); flex-shrink: 0;
  }
  .warmup .ex-num { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .cardio .ex-num { background: #e5ecf6; color: #334d76; border-color: transparent; }
  .stretch-card .ex-num { background: #eadfc5; color: #7d6130; border-color: transparent; }

  .ex-main { min-width: 0; }
  .ex-name {
    font-size: 15px; font-weight: 600; color: var(--ink);
    margin-bottom: 4px;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .ex-benefit-tag {
    font-size: 11px; font-weight: 500;
    color: var(--accent-deep); background: var(--accent-soft);
    padding: 2px 8px; border-radius: 999px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .ex-equipment {
    font-size: 12px; color: var(--ink-3);
    display: flex; align-items: center; gap: 5px;
  }
  .ex-equipment .click-hint {
    color: var(--accent); font-size: 11px;
    margin-left: 2px; font-weight: 500;
  }
  .ex-stats { display: flex; gap: 5px; align-items: center; flex-shrink: 0; }
  .stat-pill {
    text-align: center;
    padding: 5px 8px; border-radius: 8px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    min-width: 48px;
  }
  .stat-pill .val { font-size: 12px; font-weight: 600; color: var(--ink); line-height: 1.2; }
  .stat-pill .lbl { font-size: 9px; color: var(--ink-3); margin-top: 2px; letter-spacing: .3px; }
  .warmup .stat-pill, .cardio .stat-pill, .stretch-card .stat-pill {
    background: transparent; border-color: transparent;
  }

  /* Stretch multi-pose preview on card */
  .stretch-poses {
    display: flex; gap: 5px;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  .stretch-pose-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 7px 3px 3px;
    background: rgba(255,255,255,.7);
    border: 1px solid #d2c6a7;
    border-radius: 6px;
    font-size: 11px; color: var(--ink-2);
  }
  .pose-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%;
    background: rgba(125, 97, 48, 0.25);
    color: #5a4420;
    font-size: 10px; font-weight: 700;
  }
  .stretch-note {
    font-size: 11px; color: #7d6130;
    margin-top: 5px;
    display: flex; align-items: center; gap: 4px;
  }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(26,34,54,.55);
    backdrop-filter: blur(4px);
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: 12px;
    opacity: 0;
    animation: fadeIn .2s ease forwards;
  }
  .modal-overlay.closing { animation: fadeOut .2s ease forwards; }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes fadeOut { to { opacity: 0; } }

  .modal {
    background: var(--bg-card);
    border-radius: 18px;
    width: 100%;
    max-width: 580px;
    max-height: 94vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    transform: translateY(16px) scale(.98);
    animation: slideUp .25s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes slideUp { to { transform: translateY(0) scale(1); } }
  .modal-closing { animation: slideDown .2s ease forwards; }
  @keyframes slideDown { to { transform: translateY(16px) scale(.98); opacity: 0; } }

  .modal-head {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0;
    background: var(--bg-card);
    z-index: 2;
    border-radius: 18px 18px 0 0;
  }
  .modal-close {
    position: absolute; top: 12px; right: 12px;
    width: 30px; height: 30px;
    border: 1px solid var(--line);
    background: var(--bg-elev);
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-3);
    transition: all .15s;
  }
  .modal-close:hover { background: var(--line-2); color: var(--ink); }
  .modal-tag {
    font-size: 11px; font-weight: 600;
    color: var(--accent-deep);
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .modal h2 {
    font-family: "Noto Serif SC", serif;
    font-size: 19px; font-weight: 700;
    margin: 0; padding-right: 34px; line-height: 1.35;
  }
  .modal-sub {
    font-size: 12px; color: var(--ink-3);
    margin-top: 3px;
  }

  /* Substitute selector (top of images) */
  .sub-selector {
    padding: 12px 20px 0;
    background: var(--bg-card);
  }
  .sub-selector-label {
    font-size: 10px; font-weight: 600;
    color: var(--ink-3);
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  .sub-selector-label::before {
    content: ""; width: 2px; height: 10px;
    background: var(--accent); border-radius: 1px;
  }
  .sub-btns {
    display: flex; gap: 5px; flex-wrap: wrap;
  }
  .sub-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 10px;
    background: var(--chip-bg);
    border: 1px solid transparent;
    border-radius: 8px;
    font-size: 11px; font-family: inherit;
    color: var(--ink-2);
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .sub-btn:hover {
    background: var(--accent-soft);
    color: var(--accent-deep);
    border-color: var(--accent);
  }
  .sub-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 500;
  }
  .sub-btn .sub-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: currentColor; opacity: .5;
  }
  .sub-btn.active .sub-dot { opacity: 1; background: #fff; }

  /* Image area: equipment + demo side by side */
  .img-area {
    padding: 12px 20px 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .img-panel {
    background: var(--line-2);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    aspect-ratio: 4 / 3;
    display: flex; align-items: center; justify-content: center;
  }
  .img-panel img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .img-panel .img-label {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 5px 10px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,.6));
    color: #fff;
    font-size: 11px; font-weight: 500;
  }
  .img-panel.missing {
    background: var(--chip-bg);
    color: var(--ink-3);
    font-size: 12px;
  }

  /* Modal body */
  .modal-body { padding: 14px 20px 20px; }
  .section-title {
    font-size: 11px; font-weight: 600;
    color: var(--ink-3);
    text-transform: uppercase; letter-spacing: 1px;
    margin: 16px 0 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::before {
    content: ""; width: 2px; height: 11px;
    background: var(--accent); border-radius: 1px;
  }
  .section-title:first-child { margin-top: 0; }

  .benefit-box {
    background: var(--ok-soft);
    border-left: 3px solid var(--ok);
    border-radius: 0 8px 8px 0;
    padding: 9px 13px;
    margin-bottom: 12px;
    font-size: 12.5px;
    color: #24523f;
    line-height: 1.6;
  }
  .benefit-box strong { color: var(--ok); font-weight: 600; }

  .modal-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 12px;
  }
  .modal-stat {
    text-align: center;
    padding: 8px 4px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 9px;
  }
  .modal-stat .v { font-size: 13px; font-weight: 700; color: var(--ink); line-height: 1.2; }
  .modal-stat .l { font-size: 9px; color: var(--ink-3); margin-top: 2px; letter-spacing: .3px; }
  .modal-stat.rpe .v { color: var(--ok); }

  .cue-box {
    background: var(--warn-soft);
    border-left: 3px solid var(--warn);
    border-radius: 0 8px 8px 0;
    padding: 9px 13px;
    margin-bottom: 12px;
    font-size: 12.5px;
    color: #6d461c;
    line-height: 1.6;
  }
  .cue-box strong { color: var(--warn); font-weight: 600; }

  /* Phases (5-step breakdown) */
  .phases-list {
    list-style: none; padding: 0; margin: 0 0 14px;
    counter-reset: phase;
    display: flex; flex-direction: column; gap: 6px;
  }
  .phase-item {
    position: relative;
    counter-increment: phase;
    padding: 8px 12px 8px 40px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 9px;
    font-size: 12.5px;
    color: var(--ink-2);
    line-height: 1.6;
  }
  .phase-item::before {
    content: counter(phase);
    position: absolute; left: 10px; top: 50%;
    transform: translateY(-50%);
    width: 22px; height: 22px;
    background: var(--accent);
    color: #fff;
    font-weight: 700; font-size: 11px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .phase-item .phase-name {
    font-weight: 600; color: var(--ink);
    margin-right: 4px;
  }
  .phase-item.setup::before { background: var(--ink-3); }
  .phase-item.concentric::before { background: var(--accent); }
  .phase-item.peak::before { background: var(--ok); }
  .phase-item.eccentric::before { background: var(--warn); }
  .phase-item.return::before { background: #6b7385; }

  .points-list {
    list-style: none; padding: 0; margin: 0 0 14px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .points-list li {
    position: relative;
    padding-left: 18px;
    font-size: 12.5px;
    color: var(--ink-2);
    line-height: 1.65;
  }
  .points-list li::before {
    content: "";
    position: absolute; left: 4px; top: 7px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent);
  }

  .stop-box {
    background: var(--stop-soft);
    border-left: 3px solid var(--stop);
    border-radius: 0 8px 8px 0;
    padding: 9px 13px;
    margin-bottom: 14px;
    font-size: 12.5px;
    color: #6f2424;
    line-height: 1.6;
  }
  .stop-box strong { color: var(--stop); font-weight: 600; }

  .eq-info {
    background: var(--chip-bg);
    border-radius: 9px;
    padding: 10px 13px;
    font-size: 12px;
    color: var(--ink-2);
    line-height: 1.65;
  }
  .eq-info strong { color: var(--ink); }

  /* Stretch block modal */
  .stretch-poses-full {
    display: flex; flex-direction: column;
    gap: 10px;
    padding: 12px 20px 0;
  }
  .stretch-pose-card {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 12px;
    background: var(--line-2);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }
  .stretch-pose-card.noimg {
    grid-template-columns: 1fr;
  }
  .stretch-pose-card.noimg .pose-order {
    top: 10px; left: 10px;
  }
  .stretch-pose-card.noimg .pose-body {
    padding: 12px 14px 12px 42px;
  }
  .stretch-pose-card .pose-body {
    padding: 10px 12px 10px 0;
    min-width: 0;
  }
  .pose-head {
    display: flex; align-items: center; gap: 7px;
    margin-bottom: 3px; flex-wrap: wrap;
  }
  .pose-name {
    font-size: 13px; font-weight: 600; color: var(--ink);
  }
  .pose-dur {
    font-size: 10px;
    background: var(--accent-soft);
    color: var(--accent-deep);
    padding: 2px 7px; border-radius: 999px;
    font-weight: 500;
  }
  .pose-cue {
    font-size: 11px; color: var(--ok);
    margin-bottom: 3px; font-weight: 500;
  }
  .pose-points {
    font-size: 11.5px; color: var(--ink-2);
    line-height: 1.5;
  }
  .pose-stop {
    font-size: 10.5px; color: var(--stop);
    margin-top: 3px;
  }
  .pose-order {
    position: absolute;
    top: 6px; left: 6px;
    width: 22px; height: 22px;
    background: var(--ink); color: #fff;
    border-radius: 50%;
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    z-index: 1;
  }
  .stretch-logic {
    margin: 12px 20px 0;
    padding: 9px 13px;
    background: #e9dfc8;
    border-radius: 8px;
    font-size: 11.5px;
    color: #6b5528;
    line-height: 1.6;
  }
  .stretch-logic strong { color: #4a3a16; }

  .dosage-section {
    margin-top: 24px;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    overflow: hidden;
  }
  .dosage-head {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--line);
  }
  .dosage-head h3 {
    font-size: 15px; font-weight: 700; margin: 0;
    display: flex; align-items: center; gap: 10px;
  }
  .dosage-head h3::before {
    content: ""; width: 3px; height: 15px;
    background: var(--accent); border-radius: 2px;
  }
  .dosage-head p {
    margin: 5px 0 0;
    font-size: 12px; color: var(--ink-3);

<script type="text/babel">
// ===== TRAINING PLAN v5 APP =====
const { useState, useEffect, useCallback, useMemo } = React;

// ========== DATA ==========
const DATA = window.PLAN_V5 || {};

// ========== DOSAGE PARAMETRIC SYSTEM ==========
// Build lookup from data.dosage_parametric
const GOALS = (DATA.dosage_parametric?.by_goal || []).map(g => ({
  id: g.id,
  name: g.name,
  ranges: g.ranges,
}));

const EXP_MAP = DATA.dosage_parametric?.by_experience || {};
const EXPERIENCES = [
  { id: "beginner_0_3m", ...(EXP_MAP.beginner_0_3m || { name: "新手 0-3 月", multiplier_sets: 0.75, rpe_cap: 8 }) },
  { id: "intermediate_3_12m", ...(EXP_MAP.intermediate_3_12m || { name: "进阶 3-12 月", multiplier_sets: 1.0, rpe_cap: 9 }) },
  { id: "advanced_12m_plus", ...(EXP_MAP.advanced_12m_plus || { name: "高阶 12 月+", multiplier_sets: 1.2, rpe_cap: 10 }) },
];

const MOVEMENT_CLASS_NAMES = {
  compound_lower:    "复合下肢",
  compound_push:     "复合推",
  compound_pull:     "复合拉",
  compound_overhead: "复合过头推",
  isolation_chest:   "孤立胸部",
  isolation_shoulder:"孤立肩部",
  isolation_arm:     "孤立手臂",
  isolation_leg:     "孤立腿部",
  isolation_core:    "孤立核心",
  cardio:            "有氧",
};

const PHASE_NAMES = {
  setup: "起始准备",
  concentric: "向心（发力）",
  peak: "顶峰收缩",
  eccentric: "离心（回放）",
  return: "复位",
};

// ========== HELPERS ==========
function parseRange(str) {
  if (!str) return [0, 0];
  const parts = String(str).split("-").map(n => parseInt(n, 10));
  if (parts.length === 1) return [parts[0], parts[0]];
  return [parts[0], parts[1]];
}

function computeDosage(movementClass, goalId, expId) {
  const goal = GOALS.find(g => g.id === goalId);
  if (!goal || !goal.ranges) return null;
  const base = goal.ranges[movementClass];
  if (!base) return null;

  const exp = EXPERIENCES.find(e => e.id === expId);
  if (!exp) return { ...base };

  const result = { ...base };

  // Apply set multiplier
  if (base.sets) {
    const [low, high] = parseRange(base.sets);
    const newLow = Math.max(1, Math.round(low * exp.multiplier_sets));
    const newHigh = Math.max(newLow, Math.round(high * exp.multiplier_sets));
    result.display_sets = newLow === newHigh ? `${newLow} 组` : `${newLow}-${newHigh} 组`;
  }

  // RPE cap
  if (base.rpe !== undefined && base.rpe !== null) {
    const capped = Math.min(base.rpe, exp.rpe_cap);
    result.display_rpe = String(capped);
  }

  // Rest format
  if (base.rest !== undefined) {
    const r = base.rest;
    if (r >= 60) {
      const mins = Math.floor(r / 60);
      const secs = r % 60;
      result.display_rest = secs === 0 ? `${mins} 分钟` : `${mins} 分 ${secs} 秒`;
    } else {
      result.display_rest = `${r} 秒`;
    }
  }

  if (base.reps) result.display_reps = base.reps + " 次";
  if (base.duration_min !== undefined) result.display_duration = `${base.duration_min} 分钟`;

  return result;
}

// Equipment catalog as map
const EQUIP_MAP = {};
(DATA.equipment_catalog || []).forEach(eq => { EQUIP_MAP[eq.id] = eq; });

const STRETCH_LIB = DATA.stretch_library || {};

const DAYS = DATA.days || [];

const COMMON_PRINCIPLES = DATA.common_principles ? [
  { title: "热身",      text: DATA.common_principles.warmup },
  { title: "动作节奏",  text: DATA.common_principles.tempo },
  { title: "呼吸",      text: DATA.common_principles.breathing },
  { title: "记录",      text: DATA.common_principles.monitor },
  { title: "恢复",      text: DATA.common_principles.recovery },
  { title: "关节优先",  text: DATA.common_principles.joint_first },
] : [];

// ========== IMAGE PATHS ==========
// HD equipment images first, fallback to old
function eqImgPath(id) {
  const eq = EQUIP_MAP[id];
  if (eq && eq.image) {
    // equipment_images_hd/xxx.jpg -> assets/equipment-hd/xxx.jpg
    const fname = eq.image.split('/').pop();
    return `assets/equipment-hd/${fname}`;
  }
  return `assets/equipment/${id}.jpg`;
}

function gifPath(demoGif) {
  if (!demoGif) return null;
  // anim_gifs/xxxx.gif -> assets/anim-gifs/xxxx.gif
  const fname = demoGif.split('/').pop();
  return `assets/anim-gifs/${fname}`;
}

function stretchGif(poseId) {
  const s = STRETCH_LIB[poseId];
  if (!s) return null;
  return gifPath(s.demo_gif);
}

function splitPoints(text) {
  if (!text) return [];
  return text.split(/[；;。\n]/).map(s => s.trim()).filter(s => s.length > 1);
}

// ========== APP ==========
function App() {
  const [activeDay, setActiveDay] = useState(0);
  const [selectedEx, setSelectedEx] = useState(null);
  const [dayIdx, setDayIdx] = useState(0);
  const [modalClosing, setModalClosing] = useState(false);
  const [goalId, setGoalId] = useState(GOALS[0]?.id || "hypertrophy");
  const [expId, setExpId] = useState("intermediate_3_12m");

  const day = DAYS[activeDay];

  const openModal = useCallback((ex) => {
    setSelectedEx(ex);
    setModalClosing(false);
  }, []);

  const closeModal = useCallback(() => {
    setModalClosing(true);
    setTimeout(() => {
      setSelectedEx(null);
      setModalClosing(false);
    }, 200);
  }, []);

  useEffect(() => {
    const handleKey = (e) => {
      if (e.key === "Escape" && selectedEx) { closeModal(); return; }
      if (!selectedEx && e.target.tagName !== "INPUT" && e.target.tagName !== "BUTTON") {
        if (e.key === "ArrowLeft" && activeDay > 0) setActiveDay(d => d - 1);
        if (e.key === "ArrowRight" && activeDay < DAYS.length - 1) setActiveDay(d => d + 1);
        if (/^[1-5]$/.test(e.key)) {
          const n = parseInt(e.key, 10) - 1;
          if (n >= 0 && n < DAYS.length) setActiveDay(n);
        }
      }
    };
    window.addEventListener("keydown", handleKey);
    return () => window.removeEventListener("keydown", handleKey);
  }, [selectedEx, activeDay, closeModal]);

  if (!day) return <div style={{padding: 40}}>加载中...</div>;

  return (
    <div className="app">
      <Hero />
      <DosageBar goalId={goalId} expId={expId} setGoal={setGoalId} setExp={setExpId} />
      <DayTabs active={activeDay} onChange={setActiveDay} />
      <DayHeader day={day} />
      <ExerciseList
        exercises={day.exercises}
        goalId={goalId}
        expId={expId}
        onSelect={openModal}
      />
      <DosageFramework goalId={goalId} expId={expId} />
      <PrinciplesSection />
      <RiskAndSourceSection />

      {selectedEx && (
        <ExerciseModal
          exercise={selectedEx}
          goalId={goalId}
          expId={expId}
          closing={modalClosing}
          onClose={closeModal}
        />
      )}
    </div>
  );
}

// ===== Exercise Card =====
function ExerciseCard({ exercise, num, goalId, expId, onClick }) {
  const eq = exercise.primary_equipment_id ? EQUIP_MAP[exercise.primary_equipment_id] : null;
  const cls = exercise.type || "";

  const dosage = useMemo(() => {
    if (exercise.type === "stretch_block" || exercise.type === "stretch") return null;
    // Warmup has static dosage
    if (exercise.dosage && exercise.type !== "main" && exercise.type !== "cardio") {
      return {
        display_sets: exercise.dosage.duration || "—",
        display_reps: exercise.dosage.intensity || null,
        display_rpe: exercise.dosage.rpe || "—",
        isStatic: true,
      };
    }
    // Cardio type main with static dosage (like treadmill warmup)
    if (exercise.type === "warmup" && exercise.dosage) {
      return {
        display_sets: exercise.dosage.duration || "—",
        display_reps: exercise.dosage.intensity || null,
        display_rpe: exercise.dosage.rpe || "—",
        isStatic: true,
      };
    }
    // Parametric
    if (exercise.movement_class) {
      const d = computeDosage(exercise.movement_class, goalId, expId);
      if (d) return d;
    }
    return null;
  }, [exercise, goalId, expId]);

  let iconNode = null;
  if (exercise.type === "warmup") iconNode = <I.Warm size={16} />;
  else if (exercise.type === "cardio") iconNode = <I.Cardio size={16} />;
  else if (exercise.type === "stretch_block" || exercise.type === "stretch") iconNode = <I.Stretch size={16} />;

  // GIF match label
  const gifMatch = exercise.demo_gif_match;
  const hasGif = exercise.demo_gif;

  return (
    <div className={`ex-card ${cls === "stretch_block" || cls === "stretch" ? "stretch-card" : cls}`} onClick={onClick}
         data-comment-anchor={`ex-${exercise.name}`}>
      <div className="ex-num">{iconNode || num}</div>
      <div className="ex-main">
        <div className="ex-name">
          {exercise.name}
          {hasGif && exercise.type !== "stretch_block" && exercise.type !== "stretch" && (
            <span className={`gif-match-badge ${gifMatch === "exact" ? "exact" : "close"}`} title={gifMatch === "exact" ? "动作与器械精确匹配" : "最近似动作示意，器械/角度可能略有差异"}>
              <I.Play size={9} />
              {gifMatch === "exact" ? "精确 GIF" : "近似 GIF"}
            </span>
          )}
          {(exercise.type === "main" && exercise.benefit) && (
            <span className="ex-benefit-tag" title={exercise.benefit}>
              {exercise.benefit.length > 20 ? exercise.benefit.slice(0, 20) + "…" : exercise.benefit}
            </span>
          )}
        </div>
        {exercise.type === "stretch_block" || exercise.type === "stretch" ? (
          <>
            <div className="ex-equipment">
              <I.Stretch size={13} />
              {(exercise.poses?.length || 0)} 个拉伸动作 · {exercise.duration} · 点击查看详情
            </div>
            <div className="stretch-poses">
              {(exercise.poses || []).map((p, i) => {
                const s = STRETCH_LIB[p];
                if (!s) return null;
                return (
                  <span className="stretch-pose-chip" key={p}>
                    <span className="pose-num">{i + 1}</span>
                    {s.name}
                    {s.demo_gif && (
                      <span className={`mini-gif-tag ${s.demo_gif_match === "exact" ? "exact" : "close"}`}>
                        <I.Play size={7} />
                      </span>
                    )}
                  </span>
                );
              })}
            </div>
            <div className="stretch-note">
              <I.Bolt size={11} />
              {exercise.pose_logic}
            </div>
          </>
        ) : (
          <div className="ex-equipment">
            {eq ? (
              <>
                <svg width={13} height={13} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{color: "var(--ink-3)"}}>
                  <rect x="2" y="9" width="20" height="6" rx="1"/>
                  <path d="M6 9V7M18 9V7M6 15v2M18 15v2"/>
                </svg>
                {eq.name}
                {exercise.movement_class && (
                  <span style={{ marginLeft: 6, color: "var(--accent-deep)", fontSize: 11, fontWeight: 500 }}>
                    · {MOVEMENT_CLASS_NAMES[exercise.movement_class] || exercise.movement_class}
                  </span>
                )}
                <span className="click-hint">查看详情 →</span>
              </>
            ) : exercise.type === "warmup" ? "热身 · 提升心率体温" : ""}
          </div>
        )}
      </div>
      <div className="ex-stats">
        {dosage && (
          <>
            <div className="stat-pill">
              <div className="val">{dosage.display_sets}</div>
              <div className="lbl">{dosage.isStatic ? "时长" : "组数"}</div>
            </div>
            {dosage.display_reps && (
              <div className="stat-pill">
                <div className="val">{dosage.display_reps}</div>
                <div className="lbl">{dosage.isStatic ? "强度" : "次数"}</div>
              </div>
            )}
            {dosage.display_rpe && dosage.display_rpe !== "—" && (
              <div className="stat-pill" style={{ background: "var(--ok-soft)", borderColor: "transparent" }}>
                <div className="val" style={{ color: "var(--ok)" }}>{dosage.display_rpe}</div>
                <div className="lbl" style={{ color: "var(--ok)", opacity: .75 }}>RPE</div>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );

// ===== Dosage Framework =====
function DosageFramework({ goalId, expId }) {
  const goal = GOALS.find(g => g.id === goalId);
  const exp = EXPERIENCES.find(e => e.id === expId);
  const table = goal?.ranges || {};

  function formatSets(setsStr) {
    if (!setsStr) return "—";
    const [low, high] = parseRange(setsStr);
    const newLow = Math.max(1, Math.round(low * exp.multiplier_sets));
    const newHigh = Math.max(newLow, Math.round(high * exp.multiplier_sets));
    return newLow === newHigh ? `${newLow} 组` : `${newLow}-${newHigh} 组`;
  }
  function formatRest(secs) {
    if (secs === undefined || secs === null) return "—";
    if (secs >= 60) {
      const mins = Math.floor(secs / 60);
      const s = secs % 60;
      return s === 0 ? `${mins} 分钟` : `${mins} 分 ${s} 秒`;
    }
    return `${secs} 秒`;
  }

  const compoundRow = table.compound_push;
  const isoRow = table.isolation_arm;
  const cardioRow = table.cardio;

  return (
    <div className="dosage-section">
      <div className="dosage-head">
        <h3>负荷框架 · 查表说明</h3>
        <p>
          当前为 <strong style={{color: "var(--accent-deep)"}}>「{goal?.name}」×「{exp?.name}」</strong> 组合。
          所有动作按 movement_class（复合推/拉/腿/肩推 vs 孤立胸/肩/臂/腿/核心）查表后，
          用经验系数调整组数下限与 RPE 上限。
        </p>
      </div>
      <div className="dosage-table">
        <div className="dt-row">
          <div className="dt-label">经验系数</div>
          <div className="dt-val">
            组数 × <strong>{exp?.multiplier_sets}</strong>，RPE ≤ <strong>{exp?.rpe_cap}</strong>
            <br />
            <span style={{ fontSize: 11, color: "var(--ink-3)" }}>{exp?.note}</span>
          </div>
        </div>

        <div className="dt-row">
          <div className="dt-label">复合动作</div>
          <div className="dt-val">
            复合推/拉/下肢/过头推：<strong>{formatSets(compoundRow?.sets)}</strong> × <strong>{compoundRow?.reps} 次</strong>
             · RPE <strong>{Math.min(compoundRow?.rpe || 0, exp?.rpe_cap || 99)}</strong> · 休息 <strong>{formatRest(compoundRow?.rest)}</strong>
          </div>
        </div>

        <div className="dt-row">
          <div className="dt-label">孤立动作</div>
          <div className="dt-val">
            <strong>{formatSets(isoRow?.sets)}</strong> × <strong>{isoRow?.reps} 次</strong>
             · RPE <strong>{Math.min(isoRow?.rpe || 0, exp?.rpe_cap || 99)}</strong> · 休息 <strong>{formatRest(isoRow?.rest)}</strong>
            <br />
            <span style={{ fontSize: 11, color: "var(--ink-3)" }}>
              胸/肩/臂/腿/核心的孤立动作次数范围略有差异（核心 12-30 次，肩 12-20 次），卡片与弹窗按各动作分类精确显示。
            </span>
          </div>
        </div>

        {cardioRow && (
          <div className="dt-row">
            <div className="dt-label">有氧</div>
            <div className="dt-val">
              <strong>{cardioRow.duration_min} 分钟</strong> · RPE <strong>{cardioRow.rpe}</strong>
              <br />
              <span style={{ fontSize: 11, color: "var(--ink-3)" }}>热身固定为 5 分钟（不联动）；训练日有氧按目标联动（增肌 10 分钟 / 力量 5 分钟 / 肌耐力 20 分钟）。</span>
            </div>
          </div>
        )}

        <div className="dt-row">
          <div className="dt-label">进阶法则</div>
          <div className="dt-val">
            {DATA.dosage_framework?.progression?.progress}
            <br />
            {DATA.dosage_framework?.progression?.stalled}
            <br />
            {DATA.dosage_framework?.progression?.deload}
          </div>
        </div>
      </div>
    </div>
  );
}
