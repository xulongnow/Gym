<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <rect x="2" y="2" width="176" height="176" rx="12" fill="#f6f3ec"/>
  <!-- wall -->
  <line x1="26" y1="18" x2="26" y2="160" stroke="#c9c2b2" stroke-width="7" stroke-linecap="round"/>
  <!-- ground -->
  <line x1="34" y1="152" x2="158" y2="152" stroke="#d8d2c4" stroke-width="3" stroke-linecap="round"/>
  <!-- torso (slight forward lean) -->
  <line x1="60" y1="47" x2="66" y2="95" stroke="#1a2236" stroke-width="6" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="61" cy="36" r="9" fill="#1a2236"/>
  <!-- standing leg -->
  <line x1="66" y1="95" x2="64" y2="125" stroke="#1a2236" stroke-width="5" stroke-linecap="round"/>
  <line x1="64" y1="125" x2="62" y2="150" stroke="#1a2236" stroke-width="5" stroke-linecap="round"/>
  <line x1="54" y1="151" x2="72" y2="151" stroke="#1a2236" stroke-width="5" stroke-linecap="round"/>
  <!-- bent leg: thigh back, shin folded up -->
  <line x1="66" y1="95" x2="95" y2="120" stroke="#1a2236" stroke-width="5" stroke-linecap="round"/>
  <line x1="95" y1="120" x2="79" y2="90" stroke="#1a2236" stroke-width="5" stroke-linecap="round"/>
  <!-- quad highlight on bent thigh front -->
  <line x1="71" y1="102" x2="91" y2="117" stroke="#c76143" stroke-width="6" stroke-linecap="round"/>
  <!-- right arm reaching back to hold foot -->
  <polyline points="58,52 44,74 77,89" fill="none" stroke="#1a2236" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="78" cy="90" r="4.5" fill="#1a2236"/>
  <!-- left arm forward to wall -->
  <line x1="58" y1="52" x2="30" y2="62" stroke="#1a2236" stroke-width="5" stroke-linecap="round"/>
  <!-- pull arrow toward hip -->
  <line x1="88" y1="82" x2="82" y2="95" stroke="#c76143" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <polygon points="78,89 88,93 83,99" fill="#c76143"/>
</svg>
