<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <rect x="2" y="2" width="176" height="176" rx="12" fill="#f6f3ec"/>
  <!-- ground -->
  <line x1="22" y1="148" x2="160" y2="148" stroke="#d8d2c4" stroke-width="3" stroke-linecap="round"/>
  <!-- body straight line: shoulder -> hip -> ankle -->
  <line x1="66" y1="108" x2="142" y2="134" stroke="#1a2236" stroke-width="6" stroke-linecap="round"/>
  <!-- head + neck -->
  <line x1="66" y1="108" x2="52" y2="100" stroke="#1a2236" stroke-width="5" stroke-linecap="round"/>
  <circle cx="44" cy="96" r="9" fill="#1a2236"/>
  <!-- upper arm down to elbow on ground -->
  <line x1="66" y1="108" x2="66" y2="146" stroke="#1a2236" stroke-width="5" stroke-linecap="round"/>
  <!-- forearm flat on ground -->
  <line x1="66" y1="146" x2="92" y2="146" stroke="#1a2236" stroke-width="5" stroke-linecap="round"/>
  <!-- feet: heel -> toe on ground -->
  <line x1="142" y1="134" x2="150" y2="146" stroke="#1a2236" stroke-width="5" stroke-linecap="round"/>
  <!-- core highlight -->
  <line x1="76" y1="112" x2="122" y2="124" stroke="#c76143" stroke-width="6" stroke-linecap="round"/>
  <!-- straight-line guide -->
  <line x1="50" y1="96" x2="146" y2="136" stroke="#c76143" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.55"/>
</svg>
