<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <rect x="2" y="2" width="176" height="176" rx="12" fill="#f6f3ec"/>
  <!-- ground -->
  <line x1="34" y1="150" x2="146" y2="150" stroke="#d8d2c4" stroke-width="3" stroke-linecap="round"/>
  <!-- legs -->
  <line x1="82" y1="95" x2="72" y2="140" stroke="#1a2236" stroke-width="5" stroke-linecap="round"/>
  <line x1="82" y1="95" x2="94" y2="140" stroke="#1a2236" stroke-width="5" stroke-linecap="round"/>
  <line x1="64" y1="142" x2="78" y2="142" stroke="#1a2236" stroke-width="5" stroke-linecap="round"/>
  <line x1="88" y1="142" x2="102" y2="142" stroke="#1a2236" stroke-width="5" stroke-linecap="round"/>
  <!-- torso -->
  <line x1="82" y1="45" x2="82" y2="95" stroke="#1a2236" stroke-width="6" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="82" cy="34" r="9" fill="#1a2236"/>
  <!-- stretched right arm: straight out, palm up -->
  <line x1="90" y1="52" x2="150" y2="48" stroke="#1a2236" stroke-width="5" stroke-linecap="round"/>
  <line x1="150" y1="48" x2="158" y2="45" stroke="#1a2236" stroke-width="4" stroke-linecap="round"/>
  <!-- biceps highlight on upper arm -->
  <line x1="93" y1="49" x2="118" y2="48" stroke="#c76143" stroke-width="6" stroke-linecap="round"/>
  <!-- left arm reaching across to pull fingers down -->
  <polyline points="74,52 102,72 154,46" fill="none" stroke="#1a2236" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- gripping hand -->
  <circle cx="154" cy="46" r="4.5" fill="#1a2236"/>
  <!-- pull-down arrow -->
  <line x1="170" y1="38" x2="170" y2="62" stroke="#c76143" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="5 4"/>
  <polygon points="166,60 174,60 170,69" fill="#c76143"/>
</svg>
