<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <rect x="6" y="6" width="208" height="208" rx="18" fill="#f6f3ec"/>
  <g fill="none" stroke="#3a4256" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- 左手握点 -->
    <line x1="44" y1="86" x2="44" y2="120"/>
    <circle cx="44" cy="124" r="9" fill="#c76143" stroke="none"/>
    <!-- 右手握点 -->
    <line x1="176" y1="86" x2="176" y2="120"/>
    <circle cx="176" cy="124" r="9" fill="#c76143" stroke="none"/>
    <!-- 弹力带（两手之间两条弧带） -->
    <path d="M44 118 C78 86, 142 86, 176 118" stroke="#c76143" stroke-width="7"/>
    <path d="M44 130 C78 100, 142 100, 176 130" stroke="#e0a48d" stroke-width="7"/>
  </g>
  <text x="110" y="182" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#3a4256" font-weight="600">弹力带 / 徒手</text>
  <text x="110" y="201" text-anchor="middle" font-family="PingFang SC,sans-serif" font-size="11.5" fill="#8a8275">Band · Bodyweight</text>
</svg>
